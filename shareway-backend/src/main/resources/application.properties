spring.application.name=shareway
sever.port=8080

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.datasource.url=jdbc:mariadb://localhost:3306/shareway
spring.datasource.username=shareway_user
spring.datasource.password=shareway_password
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect